name: isohedron
description: "Minimal task manager with Google Tasks integration and reflection loop."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  googleapis: ^13.2.0
  http: ^1.2.0
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^17.2.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
